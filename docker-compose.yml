name: wallet

x-app-env: &app-env
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Tokens carry iss=http://localhost:8081/realms/wallet (KEYCLOAK_PORT
  # changes the host port and the issuer together) whether they are
  # requested from the host (localhost:8081) or from the compose network
  # (keycloak:8080): KC_HOSTNAME pins the frontend URL. The app fetches the
  # JWKS through the internal name (OIDC_JWKS_URL).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; probe the management port with bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  ministack:
    image: ministackorg/ministack:1.5.16
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as r; r.urlopen('http://localhost:4566/_ministack/health')\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.19.1
    <<: *app-env
    volumes:
      - ./migrations:/migrations:ro
    # `docker compose run --rm migrate <up|down 1|version|...>` replaces the command.
    entrypoint: ["sh", "-c", 'exec migrate -path /migrations -database "$$DATABASE_URL" "$$@"', "migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  sqs-init:
    image: ministackorg/ministack:1.5.16
    <<: *app-env
    volumes:
      - ./deploy/sqs-init:/deploy/sqs-init:ro
    entrypoint: ["sh", "/deploy/sqs-init/init.sh"]
    healthcheck:
      disable: true
    depends_on:
      ministack:
        condition: service_healthy

  app:
    build: .
    <<: *app-env
    environment:
      # Follows KEYCLOAK_PORT so the expected issuer matches KC_HOSTNAME.
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wallet
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ministack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully

volumes:
  pgdata:
